name: Build Quarto Docs
on:
  workflow_dispatch:
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Install renv
        run: install.packages("renv", repos = "https://packagemanager.posit.co/cran/latest")
        shell: Rscript {0}
      - name: Restore R dependencies
        run: renv::restore(prompt = FALSE)
        shell: Rscript {0}
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Render Website
        uses: quarto-dev/quarto-actions/render@v2
